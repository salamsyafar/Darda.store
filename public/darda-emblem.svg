  <path
    d="M 250 96
       C 292 132, 345 154, 376 192
       C 394 214, 402 242, 402 276
       L 402 462
       C 402 472, 394 480, 384 480
       L 366 480
       L 366 392
       C 386 382, 390 356, 376 332
       L 356 296
       L 356 272
       C 356 244, 348 222, 330 204
       C 306 180, 274 164, 250 140
       C 226 164, 194 180, 170 204
       C 152 222, 144 244, 144 272
       L 144 296
       L 124 332
       C 110 356, 114 382, 134 392
       L 134 480
       L 116 480
       C 106 480, 98 472, 98 462
       L 98 276
       C 98 242, 106 214, 124 192
       C 155 154, 208 132, 250 96
       Z"
