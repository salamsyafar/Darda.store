  <path d="M 250 204 L 258 216 L 242 216 Z" fill="url(#goldDome)" />

  <!-- Golden Dome -->
  <path
    d="M 250 212
       C 262 232, 294 244, 316 268
       C 326 279, 331 289, 333 296
       L 167 296
       C 169 289, 174 279, 184 268
       C 206 244, 238 232, 250 212
