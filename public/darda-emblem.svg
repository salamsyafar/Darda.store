<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" fill="none">
  <defs>
    <!-- Forest Green 3D Gradient (#0F3D2E) -->
    <linearGradient id="forestGreen" x1="120" y1="60" x2="390" y2="490" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17523F" />
      <stop offset="45%" stop-color="#0F3D2E" />
      <stop offset="100%" stop-color="#08261C" />
    </linearGradient>

    <!-- Forest Green Highlight for 3D Bevel -->
    <linearGradient id="forestBevel" x1="150" y1="50" x2="350" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#256F56" />
      <stop offset="50%" stop-color="#0F3D2E" />
      <stop offset="100%" stop-color="#072219" />
    </linearGradient>

    <!-- Warm Gold 3D Dome Gradient (#D4AF37) -->
    <linearGradient id="warmGold" x1="200" y1="240" x2="310" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6DF86" />
      <stop offset="38%" stop-color="#DFB944" />
      <stop offset="75%" stop-color="#C89E28" />
      <stop offset="100%" stop-color="#9F7916" />
    </linearGradient>

    <!-- Cream Mihrab Arch Gradient (#F8F4E9) -->
    <linearGradient id="creamArch" x1="250" y1="200" x2="250" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F4E9" />
      <stop offset="100%" stop-color="#EDE5D0" />
    </linearGradient>

    <!-- Soft 3D Drop Shadow -->
    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#08261C" flood-opacity="0.22" />
    </filter>
  </defs>

  <g filter="url(#logoShadow)">
    <!-- 1. Shopping Bag Handle at Top (Forest Green #0F3D2E) -->
    <path
      d="M 192 142
         C 192 78, 308 78, 308 142
         L 308 156
         C 295 150, 282 146, 272 144
         L 272 138
         C 272 104, 228 104, 228 138
         L 228 144
         C 218 146, 205 150, 192 156
         Z"
      fill="url(#forestBevel)"
    />

    <!-- 2. Main Lowercase 'd' Bowl & Right Vertical Stem (Forest Green #0F3D2E) -->
    <path
      d="M 332 128
         C 332 104, 350 92, 372 92
         L 382 92
         C 390 92, 396 98, 396 106
         L 396 364
         C 396 426, 368 468, 332 480
         L 332 294
         C 332 248, 294 218, 250 182
         C 206 218, 168 248, 168 294
         L 168 476
         C 118 450, 92 396, 92 332
         C 92 232, 164 164, 252 164
         C 284 164, 312 173, 332 188
         Z"
      fill="url(#forestGreen)"
    />

    <!-- 3. Cream Mihrab Outer Arch Frame (#F8F4E9) -->
    <path
      d="M 250 182
         C 294 218, 332 248, 332 294
         L 332 480
         L 168 476
         L 168 294
         C 168 248, 206 218, 250 182
         Z"
      fill="url(#creamArch)"
    />

    <!-- 4. Crisp White Inner Mihrab Arch -->
    <path
      d="M 250 212
         C 284 242, 312 266, 312 304
         L 312 440
         L 188 440
         L 188 304
         C 188 266, 216 242, 250 212
         Z"
      fill="#FFFFFF"
    />

    <!-- 5. Warm Gold Mosque Dome + Crescent Finial (#D4AF37) -->
    <!-- Crescent Moon (Hilal) -->
    <path
      d="M 252 242
         C 242 242, 234 250, 234 260
         C 234 270, 242 278, 252 278
         C 258 278, 263 275, 266 271
         C 262 273, 258 273, 254 271
         C 246 268, 243 259, 246 251
         C 248 246, 253 243, 258 243
         C 256 242, 254 242, 252 242
         Z"
      fill="url(#warmGold)"
    />
    <!-- Spire Rod -->
    <rect x="248" y="275" width="4" height="16" rx="2" fill="url(#warmGold)" />

    <!-- Mosque Dome (Kubah) -->
    <path
      d="M 250 286
         C 256 306, 272 322, 290 338
         C 304 350, 310 368, 310 392
         L 190 392
         C 190 368, 196 350, 210 338
         C 228 322, 244 306, 250 286
         Z"
      fill="url(#warmGold)"
    />

    <!-- White Arch Separator Line Above Base -->
    <path
      d="M 188 392 Q 250 382 312 392 L 312 402 L 188 402 Z"
      fill="#FFFFFF"
    />

    <!-- 6. Forest Green Rounded Base Bar Inside Arch (#0F3D2E) -->
    <path
      d="M 212 396
         L 288 396
         C 308 396, 324 412, 324 432
         L 324 474
         C 324 480, 319 484, 313 484
         L 187 484
         C 181 484, 176 480, 176 474
         L 176 432
         C 176 412, 192 396, 212 396
         Z"
      fill="url(#forestGreen)"
    />
  </g>
</svg>
