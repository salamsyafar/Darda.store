<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 520" fill="none">
  <defs>
    <!-- Forest Green Gradient (#0F3D2E to #1E6E3A) -->
    <linearGradient id="archGrad" x1="250" y1="90" x2="250" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E7A3C" />
      <stop offset="35%" stop-color="#0F4C35" />
      <stop offset="100%" stop-color="#0A3323" />
    </linearGradient>

    <!-- Handle Forest Green -->
    <linearGradient id="handleGrad" x1="250" y1="20" x2="250" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#145A3E" />
      <stop offset="100%" stop-color="#0B3B28" />
    </linearGradient>

    <!-- Warm Gold Dome Gradient (#D4AF37) -->
    <linearGradient id="goldDome" x1="190" y1="165" x2="315" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6D76B" />
      <stop offset="45%" stop-color="#E0B43B" />
      <stop offset="100%" stop-color="#C49322" />
    </linearGradient>

    <!-- Fresh Green Awning Center Scallops (#2E7D32) -->
    <linearGradient id="freshGreenAwning" x1="250" y1="305" x2="250" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E8B40" />
      <stop offset="100%" stop-color="#1B682C" />
    </linearGradient>
  </defs>

  <!-- 1. Top Shopping Bag Handle -->
  <path
    d="M 168 148
