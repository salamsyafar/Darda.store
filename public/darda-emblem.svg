  />

  <!-- Inner Bottom Left & Right Store Pillars -->
  <path
    d="M 146 398 L 184 398 L 184 464 C 184 474, 176 480, 166 480 L 146 480 Z"
    fill="#0A3323"
  />
  <path
    d="M 316 398 L 354 398 L 354 480 L 334 480 C 324 480, 316 474, 316 464 Z"
