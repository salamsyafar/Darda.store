<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <defs>
    <linearGradient id="hEmeraldD" x1="20" y1="10" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#145A38" />
      <stop offset="45%" stop-color="#0C3B29" />
      <stop offset="100%" stop-color="#05261A" />
    </linearGradient>

    <linearGradient id="hGoldLeaf" x1="10" y1="30" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5C158" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#996E06" />
    </linearGradient>
  </defs>

  <!-- ================= EMBLEM ICON (Left) ================= -->
  <g transform="translate(10, 8) scale(0.38)">
    <!-- Letter D Body -->
    <path
      d="M 152 86 L 152 280 C 152 280 210 286 252 280 C 320 270 348 220 348 180 C 348 120 290 86 230 86 Z"
      fill="url(#hEmeraldD)"
    />
    <!-- Outer Arch -->
    <path
      d="M 152 86 C 152 86 230 84 280 102 C 336 122 350 178 344 228 C 336 284 290 326 234 326 C 200 326 175 308 175 308 L 190 286 C 190 286 212 300 236 300 C 272 300 312 268 318 222 C 324 180 310 134 266 118 C 226 104 178 106 178 106 Z"
      fill="url(#hEmeraldD)"
    />
    <!-- Inner White Arch -->
    <path
      d="M 246 112 C 246 112 222 144 204 172 C 192 192 192 274 192 274 L 298 274 C 298 274 298 192 286 172 C 268 144 246 112 246 112 Z"
      fill="#FFFFFF"
    />
    <!-- Mosque Dome -->
    <path
      d="M 246 160 C 246 160 234 184 216 196 C 210 200 210 274 210 274 L 280 274 C 280 274 280 200 274 196 C 256 184 246 160 246 160 Z"
      fill="#0C3B29"
    />
    <!-- Crescent Moon -->
    <path
      d="M 246 130 C 252 130 258 136 258 143 C 258 150 252 156 245 156 C 238 156 234 150 234 144 C 234 140 236 137 238 135 C 236 139 237 146 242 149 C 247 151 252 148 252 143 C 252 137 248 132 246 130 Z"
      fill="url(#hGoldLeaf)"
    />
    <!-- Leaf -->
    <path
      d="M 152 172 C 152 172 142 220 160 260 C 176 294 214 314 246 312 C 246 312 212 300 194 274 C 172 240 176 198 152 172 Z"
      fill="url(#hGoldLeaf)"
    />
    <path
      d="M 152 172 C 152 172 178 206 194 246 C 208 280 246 312 246 312 C 246 312 222 284 210 254 C 192 214 174 186 152 172 Z"
      fill="#F3D17A"
      opacity="0.9"
    />
    <path
      d="M 154 176 C 174 212 200 256 242 310"
      stroke="#FFFFFF"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.95"
    />
  </g>

  <!-- ================= TEXT LOCKUP (Right) ================= -->
  <!-- "DARDA" -->
  <text
    x="125"
    y="56"
    font-family="'Cinzel', 'Playfair Display', Georgia, serif"
    font-weight="700"
    font-size="44"
    letter-spacing="2"
    fill="#0C3B29"
  >
    DARDA
  </text>

  <!-- "— STORE —" -->
  <g transform="translate(125, 75)">
    <line x1="0" y1="-5" x2="35" y2="-5" stroke="url(#hGoldLeaf)" stroke-width="1.5" stroke-linecap="round" />
    <text
      x="80"
      y="0"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', system-ui, sans-serif"
      font-weight="700"
      font-size="16"
      letter-spacing="6"
      fill="url(#hGoldLeaf)"
    >
      STORE
    </text>
    <line x1="125" y1="-5" x2="160" y2="-5" stroke="url(#hGoldLeaf)" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Tagline -->
  <text
    x="125"
    y="102"
    font-family="'Playfair Display', Georgia, serif"
    font-style="italic"
    font-weight="600"
    font-size="14"
    fill="#0C3B29"
    opacity="0.9"
  >
    Belanja Berkah, Dukung UMKM Jamaah
  </text>
</svg>
